openapi: 3.0.3
info:
  title: 'Multi-Tenant Platform API Documentation'
  description: 'A multi-service, multi-tenant platform with identity management, tenant isolation, and CMS capabilities. This API enables you to manage services, tenants, and content across isolated tenant contexts.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: 'Platform Management'
    description: "\nAPIs for managing platform services and tenants. These endpoints require authentication\nand allow users to list available services and manage their tenants."
  -
    name: 'CMS - Management'
    description: "\nManage content items (posts, pages, projects) within a CMS tenant.\nAll endpoints require authentication and the `X-Tenant-ID` header.\nContent is isolated by tenant - you can only manage content in tenants you own or are a member of."
  -
    name: 'CMS - Content Delivery'
    description: "\nPublic content delivery API for consuming published CMS content.\nAccess is controlled by tenant access level (public, private, or token_protected).\nNo authentication required for public tenants. Use the tenant's public slug in the URL.\n\n## Tenant Access Levels\n\n- **public**: Anyone can access content, no authentication needed\n- **private**: Content is completely inaccessible via this API\n- **token_protected**: Requires `Authorization: Bearer {tenant_public_api_key}` header\n\n## URL Structure\n\nAll endpoints use the pattern: `/api/content/cms/{tenant_slug}/...`\nwhere `{tenant_slug}` is the tenant's public slug (e.g., \"my-blog-abc123\")."
components:
  securitySchemes:
    default:
      type: apiKey
      name: Authorization
      in: header
      description: null
security:
  -
    default: []
paths:
  /api/manage/services:
    get:
      summary: 'List all services'
      operationId: listAllServices
      description: "Returns a list of all active services available on the platform.\nServices are logical groupings of functionality (e.g., CMS).\nYou'll need a service ID when creating a tenant."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: CMS
                      slug: cms
                      description: 'Content Management System'
                      is_active: true
                      created_at: '2025-01-20T10:00:00.000000Z'
                      updated_at: '2025-01-20T10:00:00.000000Z'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: CMS
                        slug: cms
                        description: 'Content Management System'
                        is_active: true
                        created_at: '2025-01-20T10:00:00.000000Z'
                        updated_at: '2025-01-20T10:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: CMS
                        slug:
                          type: string
                          example: cms
                        description:
                          type: string
                          example: 'Content Management System'
                        is_active:
                          type: boolean
                          example: true
                        created_at:
                          type: string
                          example: '2025-01-20T10:00:00.000000Z'
                        updated_at:
                          type: string
                          example: '2025-01-20T10:00:00.000000Z'
      tags:
        - 'Platform Management'
  /api/manage/tenants:
    get:
      summary: 'List your tenants'
      operationId: listYourTenants
      description: "Returns all tenants that the authenticated user owns or is a member of.\nThis includes both tenants you created and tenants you've been invited to."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: 'My CMS'
                      service_id: 1
                      owner_id: 1
                      public_slug: my-cms-abc123
                      access_level: public
                      public_api_key: pk_1234567890abcdef
                      settings: {  }
                      created_at: '2025-01-20T10:00:00.000000Z'
                      updated_at: '2025-01-20T10:00:00.000000Z'
                      service:
                        id: 1
                        name: CMS
                        slug: cms
                        description: 'Content Management System'
                        is_active: true
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'My CMS'
                        service_id: 1
                        owner_id: 1
                        public_slug: my-cms-abc123
                        access_level: public
                        public_api_key: pk_1234567890abcdef
                        settings: []
                        created_at: '2025-01-20T10:00:00.000000Z'
                        updated_at: '2025-01-20T10:00:00.000000Z'
                        service:
                          id: 1
                          name: CMS
                          slug: cms
                          description: 'Content Management System'
                          is_active: true
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'My CMS'
                        service_id:
                          type: integer
                          example: 1
                        owner_id:
                          type: integer
                          example: 1
                        public_slug:
                          type: string
                          example: my-cms-abc123
                        access_level:
                          type: string
                          example: public
                        public_api_key:
                          type: string
                          example: pk_1234567890abcdef
                        settings:
                          type: object
                          properties: {  }
                        created_at:
                          type: string
                          example: '2025-01-20T10:00:00.000000Z'
                        updated_at:
                          type: string
                          example: '2025-01-20T10:00:00.000000Z'
                        service:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: CMS
                            slug:
                              type: string
                              example: cms
                            description:
                              type: string
                              example: 'Content Management System'
                            is_active:
                              type: boolean
                              example: true
      tags:
        - 'Platform Management'
    post:
      summary: 'Create a tenant'
      operationId: createATenant
      description: "Creates a new tenant for a specific service. You become the owner and are\nautomatically added as an admin member. The tenant will have a unique public\nslug used for public content access."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 2
                    name: 'My Blog'
                    service_id: 1
                    owner_id: 1
                    public_slug: my-blog
                    access_level: public
                    public_api_key: pk_abcdefghijklmnopqrstuvwxyz123456789
                    settings: {  }
                    created_at: '2025-01-22T10:00:00.000000Z'
                    updated_at: '2025-01-22T10:00:00.000000Z'
                    service:
                      id: 1
                      name: CMS
                      slug: cms
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: 'My Blog'
                      service_id:
                        type: integer
                        example: 1
                      owner_id:
                        type: integer
                        example: 1
                      public_slug:
                        type: string
                        example: my-blog
                      access_level:
                        type: string
                        example: public
                      public_api_key:
                        type: string
                        example: pk_abcdefghijklmnopqrstuvwxyz123456789
                      settings:
                        type: object
                        properties: {  }
                      created_at:
                        type: string
                        example: '2025-01-22T10:00:00.000000Z'
                      updated_at:
                        type: string
                        example: '2025-01-22T10:00:00.000000Z'
                      service:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: CMS
                          slug:
                            type: string
                            example: cms
      tags:
        - 'Platform Management'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The display name of the tenant.'
                  example: 'My Blog'
                  nullable: false
                service_id:
                  type: integer
                  description: 'The ID of the service (get from /api/manage/services).'
                  example: 1
                  nullable: false
                public_slug:
                  type: string
                  description: 'Optional custom public slug (must be unique). If not provided, one will be auto-generated.'
                  example: my-blog
                  nullable: false
                access_level:
                  type: string
                  description: 'Access level for public content API. One of: public, private, token_protected. Default is private.'
                  example: public
                  nullable: false
              required:
                - name
                - service_id
  '/api/manage/tenants/{id}':
    get:
      summary: 'Get tenant details'
      operationId: getTenantDetails
      description: "Returns detailed information about a specific tenant, including its members.\nYou must be the owner or a member to access this endpoint."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'My CMS'
                    service_id: 1
                    owner_id: 1
                    public_slug: my-cms-abc123
                    access_level: public
                    public_api_key: pk_1234567890abcdef
                    settings: {  }
                    created_at: '2025-01-20T10:00:00.000000Z'
                    updated_at: '2025-01-20T10:00:00.000000Z'
                    service:
                      id: 1
                      name: CMS
                      slug: cms
                    users:
                      -
                        id: 1
                        name: 'John Doe'
                        email: john@example.com
                        pivot:
                          role: admin
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'My CMS'
                      service_id:
                        type: integer
                        example: 1
                      owner_id:
                        type: integer
                        example: 1
                      public_slug:
                        type: string
                        example: my-cms-abc123
                      access_level:
                        type: string
                        example: public
                      public_api_key:
                        type: string
                        example: pk_1234567890abcdef
                      settings:
                        type: object
                        properties: {  }
                      created_at:
                        type: string
                        example: '2025-01-20T10:00:00.000000Z'
                      updated_at:
                        type: string
                        example: '2025-01-20T10:00:00.000000Z'
                      service:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: CMS
                          slug:
                            type: string
                            example: cms
                      users:
                        type: array
                        example:
                          -
                            id: 1
                            name: 'John Doe'
                            email: john@example.com
                            pivot:
                              role: admin
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: 'John Doe'
                            email:
                              type: string
                              example: john@example.com
                            pivot:
                              type: object
                              properties:
                                role:
                                  type: string
                                  example: admin
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'You do not have access to this tenant.'
                properties:
                  message:
                    type: string
                    example: 'You do not have access to this tenant.'
      tags:
        - 'Platform Management'
    put:
      summary: 'Update a tenant'
      operationId: updateATenant
      description: "Updates tenant information such as name, public slug, or access level.\nOnly the tenant owner can perform updates. You can also regenerate the\npublic API key used for token-protected content access."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Updated Blog Name'
                    service_id: 1
                    owner_id: 1
                    public_slug: updated-blog
                    access_level: token_protected
                    public_api_key: pk_newgeneratedkey1234567890
                    settings: {  }
                    created_at: '2025-01-20T10:00:00.000000Z'
                    updated_at: '2025-01-22T11:00:00.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Updated Blog Name'
                      service_id:
                        type: integer
                        example: 1
                      owner_id:
                        type: integer
                        example: 1
                      public_slug:
                        type: string
                        example: updated-blog
                      access_level:
                        type: string
                        example: token_protected
                      public_api_key:
                        type: string
                        example: pk_newgeneratedkey1234567890
                      settings:
                        type: object
                        properties: {  }
                      created_at:
                        type: string
                        example: '2025-01-20T10:00:00.000000Z'
                      updated_at:
                        type: string
                        example: '2025-01-22T11:00:00.000000Z'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Only the tenant owner can perform this action.'
                properties:
                  message:
                    type: string
                    example: 'Only the tenant owner can perform this action.'
      tags:
        - 'Platform Management'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The display name.'
                  example: 'Updated Blog Name'
                  nullable: false
                public_slug:
                  type: string
                  description: 'Custom public slug (must be unique).'
                  example: updated-blog
                  nullable: false
                access_level:
                  type: string
                  description: 'Access level: public, private, or token_protected.'
                  example: token_protected
                  nullable: false
                regenerate_api_key:
                  type: boolean
                  description: 'Set to true to generate a new public API key.'
                  example: false
                  nullable: false
    delete:
      summary: 'Delete a tenant'
      operationId: deleteATenant
      description: "Permanently deletes a tenant and all associated data. This action cannot be undone.\nOnly the tenant owner can delete a tenant."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Tenant deleted successfully'
                properties:
                  message:
                    type: string
                    example: 'Tenant deleted successfully'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Only the tenant owner can delete this tenant.'
                properties:
                  message:
                    type: string
                    example: 'Only the tenant owner can delete this tenant.'
      tags:
        - 'Platform Management'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the tenant.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: tenant
        description: 'The ID of the tenant.'
        example: 1
        required: true
        schema:
          type: integer
  /api/manage/cms/content:
    get:
      summary: 'List content items'
      operationId: listContentItems
      description: "Returns a paginated list of content items in the current tenant.\nYou can filter by type (post, page, project) and status (draft, published, archived)."
      parameters:
        -
          in: query
          name: type
          description: 'Filter by content type: post, page, or project.'
          example: post
          required: false
          schema:
            type: string
            description: 'Filter by content type: post, page, or project.'
            example: post
            nullable: false
        -
          in: query
          name: status
          description: 'Filter by status: draft, published, or archived.'
          example: published
          required: false
          schema:
            type: string
            description: 'Filter by status: draft, published, or archived.'
            example: published
            nullable: false
        -
          in: header
          name: X-Tenant-ID
          description: ''
          example: 'required The ID of the tenant context. Example: 1'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  current_page: 1
                  data:
                    -
                      id: 1
                      tenant_id: 1
                      type: post
                      title: 'My First Blog Post'
                      slug: my-first-blog-post
                      excerpt: 'This is a short excerpt'
                      body: 'Full content goes here...'
                      status: published
                      author_id: 1
                      published_at: '2025-01-22T10:00:00.000000Z'
                      meta: {  }
                      created_at: '2025-01-22T09:00:00.000000Z'
                      updated_at: '2025-01-22T10:00:00.000000Z'
                      author:
                        id: 1
                        name: 'John Doe'
                        email: john@example.com
                      tags:
                        -
                          id: 1
                          name: Laravel
                          slug: laravel
                  per_page: 15
                  total: 25
                properties:
                  current_page:
                    type: integer
                    example: 1
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        tenant_id: 1
                        type: post
                        title: 'My First Blog Post'
                        slug: my-first-blog-post
                        excerpt: 'This is a short excerpt'
                        body: 'Full content goes here...'
                        status: published
                        author_id: 1
                        published_at: '2025-01-22T10:00:00.000000Z'
                        meta: []
                        created_at: '2025-01-22T09:00:00.000000Z'
                        updated_at: '2025-01-22T10:00:00.000000Z'
                        author:
                          id: 1
                          name: 'John Doe'
                          email: john@example.com
                        tags:
                          -
                            id: 1
                            name: Laravel
                            slug: laravel
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        tenant_id:
                          type: integer
                          example: 1
                        type:
                          type: string
                          example: post
                        title:
                          type: string
                          example: 'My First Blog Post'
                        slug:
                          type: string
                          example: my-first-blog-post
                        excerpt:
                          type: string
                          example: 'This is a short excerpt'
                        body:
                          type: string
                          example: 'Full content goes here...'
                        status:
                          type: string
                          example: published
                        author_id:
                          type: integer
                          example: 1
                        published_at:
                          type: string
                          example: '2025-01-22T10:00:00.000000Z'
                        meta:
                          type: object
                          properties: {  }
                        created_at:
                          type: string
                          example: '2025-01-22T09:00:00.000000Z'
                        updated_at:
                          type: string
                          example: '2025-01-22T10:00:00.000000Z'
                        author:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: 'John Doe'
                            email:
                              type: string
                              example: john@example.com
                        tags:
                          type: array
                          example:
                            -
                              id: 1
                              name: Laravel
                              slug: laravel
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              name:
                                type: string
                                example: Laravel
                              slug:
                                type: string
                                example: laravel
                  per_page:
                    type: integer
                    example: 15
                  total:
                    type: integer
                    example: 25
      tags:
        - 'CMS - Management'
    post:
      summary: 'Create content item'
      operationId: createContentItem
      description: "Creates a new content item (post, page, or project). The authenticated user\nbecomes the author. You can optionally attach tags and set the status.\nIf no slug is provided, one will be auto-generated from the title."
      parameters:
        -
          in: header
          name: X-Tenant-ID
          description: ''
          example: 'required The ID of the tenant context. Example: 1'
          schema:
            type: string
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 5
                    tenant_id: 1
                    type: post
                    title: 'Getting Started with Laravel'
                    slug: getting-started-with-laravel
                    excerpt: 'Learn the basics of Laravel'
                    body: '# Getting Started...'
                    status: published
                    author_id: 1
                    published_at: '2025-01-22T10:00:00.000000Z'
                    meta:
                      featured: true
                    created_at: '2025-01-22T09:30:00.000000Z'
                    updated_at: '2025-01-22T09:30:00.000000Z'
                    author:
                      id: 1
                      name: 'John Doe'
                      email: john@example.com
                    tags:
                      -
                        id: 1
                        name: Laravel
                        slug: laravel
                      -
                        id: 2
                        name: PHP
                        slug: php
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      tenant_id:
                        type: integer
                        example: 1
                      type:
                        type: string
                        example: post
                      title:
                        type: string
                        example: 'Getting Started with Laravel'
                      slug:
                        type: string
                        example: getting-started-with-laravel
                      excerpt:
                        type: string
                        example: 'Learn the basics of Laravel'
                      body:
                        type: string
                        example: '# Getting Started...'
                      status:
                        type: string
                        example: published
                      author_id:
                        type: integer
                        example: 1
                      published_at:
                        type: string
                        example: '2025-01-22T10:00:00.000000Z'
                      meta:
                        type: object
                        properties:
                          featured:
                            type: boolean
                            example: true
                      created_at:
                        type: string
                        example: '2025-01-22T09:30:00.000000Z'
                      updated_at:
                        type: string
                        example: '2025-01-22T09:30:00.000000Z'
                      author:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: john@example.com
                      tags:
                        type: array
                        example:
                          -
                            id: 1
                            name: Laravel
                            slug: laravel
                          -
                            id: 2
                            name: PHP
                            slug: php
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: Laravel
                            slug:
                              type: string
                              example: laravel
      tags:
        - 'CMS - Management'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: 'Type of content: post, page, or project.'
                  example: post
                  nullable: false
                title:
                  type: string
                  description: 'The title of the content.'
                  example: 'Getting Started with Laravel'
                  nullable: false
                slug:
                  type: string
                  description: 'Optional URL-friendly slug. Auto-generated if not provided.'
                  example: getting-started-with-laravel
                  nullable: false
                excerpt:
                  type: string
                  description: 'Short summary or excerpt.'
                  example: 'Learn the basics of Laravel'
                  nullable: true
                body:
                  type: string
                  description: 'The full content body (HTML/Markdown).'
                  example: '# Getting Started\n\nLaravel is amazing...'
                  nullable: false
                status:
                  type: string
                  description: 'Status: draft, published, or archived. Default is draft.'
                  example: published
                  nullable: false
                published_at:
                  type: string
                  description: 'Publish date in ISO format.'
                  example: '2025-01-22T10:00:00Z'
                  nullable: true
                meta:
                  type: object
                  description: 'Custom metadata as key-value pairs.'
                  example:
                    featured: true
                  nullable: true
                  properties: {  }
                tags:
                  type: array
                  description: 'Array of tag IDs to attach.'
                  example:
                    - 1
                    - 2
                    - 3
                  items:
                    type: integer
              required:
                - type
                - title
                - body
  '/api/manage/cms/content/{id}':
    get:
      summary: 'Get content item'
      operationId: getContentItem
      description: "Returns detailed information about a specific content item, including\nauthor details, tags, and comments."
      parameters:
        -
          in: header
          name: X-Tenant-ID
          description: ''
          example: 'required The ID of the tenant context. Example: 1'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
